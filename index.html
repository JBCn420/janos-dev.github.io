<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Developer Portfolio</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #1a1a1a; color: #fff; }
    header { text-align: center; padding: 20px 0; border-bottom: 1px solid #333; }
    .btn { display: inline-block; padding: 10px 20px; background-color: #007acc; color: #fff; text-decoration: none; border-radius: 5px; margin-top: 10px; }
    .project-card { background: #2a2a2a; padding: 20px; margin: 20px 0; border-radius: 8px; }
    .category-tag { background: #444; padding: 4px 8px; border-radius: 4px; font-size: 0.9em; }
    img { max-width: 100%; height: auto; border-radius: 5px; margin: 10px 0; }
  </style>
</head>
<body>

  <header>
    <h1>Game Developer Portfolio</h1>
    <p>Unity & C# Developer</p>
    <a href="resume.pdf" class="btn" target="_blank">Download Resume (CV)</a>
  </header>

  <main>
    <section>
      <h2>Featured Projects</h2>

      <div class="project-card">
        <h3>Project Name</h3>
        <span class="category-tag">3D Action / PC</span>
        <p><img src="gameplay.jpg" alt="Gameplay Screenshot"></p>
        
        <h4>Technical Overview & Implementation</h4>
        <p>Detailed explanation of how the game was built, architecture decisions, and key mechanics developed.</p>

        <a href="https://drive.google.com/file/d/YOUR_FILE_ID/view" class="btn" target="_blank">Download Game (.exe)</a>

    </section>

</body>
